# Opens a pull request when an action that is pinned in a workflow or in the setup action has a
# newer release; verify.yml checks that pull request. Dependabot rewrites the commit and the
# version comment together. The PowerShell and actionlint pins of the setup action are downloads,
# not actions, and are updated by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
