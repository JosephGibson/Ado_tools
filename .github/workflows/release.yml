# Builds, verifies and publishes an AdoToolkit release when a v<major>.<minor>.<patch> tag is
# pushed. The tag must match VersionPrefix in Directory.Build.props. Assets: a portable Windows
# x64 bundle, the module-only zip, their SHA-256 checksums and the standalone module installer.
# The portable bundle includes the exact PowerShell runtime that the setup action verified. The
# release text is the CHANGELOG.md section of the version, then the installation instructions.
#
# A manual run publishes an existing tag whose run did not start, or failed for a reason outside
# the tagged files. It takes this file from the branch it is started on and everything else,
# the setup action included, from the tag.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, in the form v<major>.<minor>.<patch>'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      POWERSHELL_TELEMETRY_OPTOUT: '1'
      ADOTOOLKIT_RELEASE_BUILD: '1'
      # The tag being released: the pushed tag, or the one named for a manual run. The steps read
      # this and never the ref of the run, which is a branch in a manual run.
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # Each action is pinned by commit; the comment is the tag that commit carried on 2026-10-01.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          # Third-party modules, packages and tests run in this job; only the publish step gets the token.
          persist-credentials: false

      # The .NET SDK, the pinned PowerShell and actionlint, and the exact build modules. The
      # action exports POWERSHELL_VERSION, which the packaging and publishing steps read.
      - uses: ./.github/actions/setup

      - name: Check the tag against the module version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (dotnet msbuild src/AdoToolkit.PowerShell/AdoToolkit.PowerShell.csproj -getProperty:Version -nologo | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') { throw 'MSBuild did not return a module version.' }
          if ("v$version" -cne $env:RELEASE_TAG) { throw "Tag $env:RELEASE_TAG does not match VersionPrefix $version." }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore
        shell: pwsh
        run: dotnet restore AdoToolkit.slnx --locked-mode

      - name: Verify
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./tools/dev.ps1 verify
          if ($LASTEXITCODE -ne 0) { throw "verify exited with $LASTEXITCODE." }

      - name: Package the verified build
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./tools/package/Publish-AdoToolkitPackage.ps1 -NoBuild
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed.' }
          $runtime = Join-Path $env:RUNNER_TEMP "PowerShell-$env:POWERSHELL_VERSION-win-x64.zip"
          $checksums = Join-Path $env:RUNNER_TEMP 'powershell-hashes.sha256'
          pwsh -NoProfile -File ./tools/package/New-AdoToolkitRelease.ps1 -PowerShellArchivePath $runtime -PowerShellChecksumPath $checksums -PowerShellVersion $env:POWERSHELL_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Release assets failed.' }

      - name: Check the portable launcher offline
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:GITHUB_WORKSPACE "artifacts/release/AdoToolkit-$env:VERSION-win-x64.zip"
          pwsh -NoProfile -File ./tools/package/Test-AdoToolkitPortable.ps1 -ArchivePath $archive -ModuleVersion $env:VERSION -PowerShellVersion $env:POWERSHELL_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Portable launcher check failed.' }

      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          $ErrorActionPreference = 'Stop'
          # The release text opens with the CHANGELOG.md section of this version: the lines under
          # its "## <version>" heading, up to the next "## " heading. Without one, nothing is published.
          $changelog = Join-Path $env:GITHUB_WORKSPACE 'CHANGELOG.md'
          $heading = '^## \[?' + [regex]::Escape($env:VERSION) + '\]?(?:\s|$)'
          $section = [Collections.Generic.List[string]]::new()
          $inSection = $false
          foreach ($line in @(if (Test-Path -LiteralPath $changelog -PathType Leaf) { Get-Content -LiteralPath $changelog })) {
            if ($line -match '^## ') {
              if ($inSection) { break }
              $inSection = $line -match $heading
            }
            elseif ($inSection) { $section.Add($line) }
          }
          $changes = ($section -join "`n").Trim()
          if (-not $changes) { throw "CHANGELOG.md has no section for $env:VERSION; the release was not published." }
          # A relative link in the changelog names a repository file; the release page is not in the
          # repository, so the link is rewritten to that file at the tag.
          $tagged = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/blob/$env:RELEASE_TAG"
          $changes = $changes -replace '\]\((?![A-Za-z][A-Za-z0-9+.-]*:|#|/)([^()\s]+)\)', "]($tagged/`$1)"
          $release = Join-Path $env:GITHUB_WORKSPACE 'artifacts/release'
          $zip = "AdoToolkit-$env:VERSION.zip"
          $portable = "AdoToolkit-$env:VERSION-win-x64.zip"
          $hash = ((Get-Content -LiteralPath (Join-Path $release "$zip.sha256") -TotalCount 1).Trim() -split '\s+')[0]
          $portableHash = ((Get-Content -LiteralPath (Join-Path $release "$portable.sha256") -TotalCount 1).Trim() -split '\s+')[0]
          $fence = '```'
          $notes = @(
            '## Changes'
            ''
            $changes -split "`n"
            ''
            '## Portable download (recommended for Windows x64)'
            ''
            "Includes PowerShell $env:POWERSHELL_VERSION and its runtime. No separate PowerShell installation, .NET SDK or administrator rights are needed."
            ''
            "1. Download ``$portable``."
            '2. Right-click the ZIP, choose Properties, select Unblock if shown, and click Apply.'
            '3. Extract the entire ZIP to a folder you can write to.'
            '4. Double-click `Start-AdoToolkit.cmd`. A console opens with AdoToolkit already loaded.'
            ''
            'To update, extract a new portable release into a new folder and use its launcher. Saved profiles are retained. The bundled PowerShell does not update itself.'
            ''
            "SHA-256 of ``$portable``: ``$portableHash`` (also available in ``$portable.sha256``)."
            ''
            '## Module-only installation'
            ''
            'Requires Windows and PowerShell 7.6 (`pwsh`). No administrator rights, .NET SDK or other modules are needed.'
            ''
            "1. Download ``$zip``, ``$zip.sha256`` and ``Install-AdoToolkit.ps1`` into one folder."
            '2. Close any PowerShell window that has AdoToolkit loaded.'
            '3. In PowerShell 7, from that folder, run:'
            ''
            "   ${fence}powershell"
            '   Unblock-File .\Install-AdoToolkit.ps1'
            "   .\Install-AdoToolkit.ps1 -Path .\$zip"
            "   $fence"
            ''
            '4. Open a new PowerShell window and run `Import-Module AdoToolkit`.'
            ''
            "SHA-256 of ``$zip``: ``$hash``"
            ''
            'AdoToolkit scripts and modules are not code-signed. Organization policies requiring signed code still apply. The module installer checks its ZIP against the SHA-256 checksum before installing.'
            ''
          )
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $notes | Set-Content -LiteralPath $notesFile -Encoding utf8
          $assets = @($portable, "$portable.sha256", $zip, "$zip.sha256", 'Install-AdoToolkit.ps1') | ForEach-Object { Join-Path $release $_ }
          # Only --notes-file: combining it with --generate-notes is not documented behaviour.
          gh release create $env:RELEASE_TAG @assets --title "AdoToolkit $env:VERSION" --notes-file $notesFile --verify-tag
          if ($LASTEXITCODE -ne 0) { throw 'Creating the release failed.' }
